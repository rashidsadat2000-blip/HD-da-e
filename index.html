<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RetailPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f3f8; --surface:#ffffff; --surface-2:#f6f7fb; --line:#e3e7ef; --text:#0f172a; --muted:#64748b;
  --accent:#f59e0b; --accent-ink:#1a1204;
  --green:#16a34a; --blue:#0284c7; --amber:#d97706; --red:#dc2626; --inkc:#0f172a;
  --chip-green:#dcfce7; --chip-blue:#e0f2fe; --chip-amber:#fef3c7; --chip-red:#fee2e2; --chip-ink:#eceff4;
  --side:#0a0e14; --side-text:#cfd6e2; --side-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1222; --surface:#111c33; --surface-2:#0e1730; --line:rgba(255,255,255,.09); --text:#e8eefc; --muted:#8fa0bd;
    --green:#34d399; --blue:#38bdf8; --amber:#fbbf24; --red:#f87171; --inkc:#94a3b8;
    --chip-green:rgba(52,211,153,.14); --chip-blue:rgba(56,189,248,.14); --chip-amber:rgba(251,191,36,.14); --chip-red:rgba(248,113,113,.14); --chip-ink:rgba(148,163,184,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1222; --surface:#111c33; --surface-2:#0e1730; --line:rgba(255,255,255,.09); --text:#e8eefc; --muted:#8fa0bd;
  --green:#34d399; --blue:#38bdf8; --amber:#fbbf24; --red:#f87171; --inkc:#94a3b8;
  --chip-green:rgba(52,211,153,.14); --chip-blue:rgba(56,189,248,.14); --chip-amber:rgba(251,191,36,.14); --chip-red:rgba(248,113,113,.14); --chip-ink:rgba(148,163,184,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter','Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Vazirmatn','Noto Sans Arabic','Inter',Tahoma,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.ic.lg{width:24px;height:24px}
.flip{transition:transform .15s}
html[dir="rtl"] .flip{transform:scaleX(-1)}
.collapsed .flip{transform:scaleX(-1)}
html[dir="rtl"] .collapsed .flip{transform:none}

.app{display:flex;height:100%}
.side{width:260px;flex:none;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto;transition:width .18s ease}
.collapsed .side{width:78px}
.collapsed .lbl,.collapsed .brand-txt,.collapsed .ver{display:none}
.collapsed .nav button{justify-content:center;padding-inline:0}
.collapsed .brand{justify-content:center}
.brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px;border-bottom:1px solid var(--side-line);margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:17px;color:#fff;line-height:1.2}
.brand-sub{font-size:11px;color:#8b95a7}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:transparent;color:var(--side-text);border-radius:10px;text-align:start;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--side-line);padding:12px 6px 2px;margin-top:12px;font-size:11px;color:#8b95a7}
.collapsed .side-foot{justify-content:center}
.side-foot .icon-btn{color:#aab4c5}

.main{flex:1;min-width:0;overflow:auto;padding:0 24px 40px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;margin:16px 0 8px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.tb-mid{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.tb-end{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border:0;background:transparent;border-radius:9px;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.menu-btn{display:none}
.pill{position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:var(--surface-2);font-size:13px;color:var(--text)}
.pill select{appearance:none;-webkit-appearance:none;border:0;background:transparent;outline:0;cursor:pointer;font-size:13px;color:inherit;padding:0;max-width:130px}
select option{background:var(--surface);color:var(--text)}
.pill.big{padding:8px 12px;background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.bell-wrap{position:relative}
.badge{position:absolute;top:-2px;inset-inline-end:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.pop{position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;z-index:30}
.pop h4{margin:4px 6px 8px;font-size:13px}
.pop .row{display:flex;justify-content:space-between;gap:10px;padding:7px 6px;border-radius:8px;font-size:13px}
.pop .row:nth-child(odd){background:var(--surface-2)}
.pop .qty{color:var(--red);font-weight:600;white-space:nowrap}

.page{padding-top:8px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:14px 0 6px}
h1{font-size:26px;line-height:1.2;margin:0}
h2.sec{font-size:16px;margin:30px 0 12px;font-weight:600}
.muted{color:var(--muted);margin:4px 0 0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--tone,transparent);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-height:96px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-label{color:var(--muted);font-size:13px}
.chip{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--chipbg,var(--chip-ink));color:var(--chipfg,var(--muted))}
.card-val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.card-val.neg{color:var(--red)}
.cur{font-size:15px;font-weight:600;color:var(--muted);margin-inline-start:6px}
.tone-green{--tone:var(--green);--chipbg:var(--chip-green);--chipfg:var(--green)}
.tone-blue{--tone:var(--blue);--chipbg:var(--chip-blue);--chipfg:var(--blue)}
.tone-amber{--tone:var(--amber);--chipbg:var(--chip-amber);--chipfg:var(--amber)}
.tone-red{--tone:var(--red);--chipbg:var(--chip-red);--chipfg:var(--red)}
.tone-ink{--tone:var(--inkc);--chipbg:var(--chip-ink);--chipfg:var(--inkc)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;padding:16px 18px;border-radius:14px;border:1px dashed var(--accent);background:var(--chip-amber)}
.banner strong{display:block;margin-bottom:2px}
.banner p{margin:0;color:var(--muted);max-width:60ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{background:var(--accent);filter:brightness(.95)}
.btn-danger{color:var(--red)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.tabs{display:flex;gap:6px;margin:18px 0 6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-top:14px}
.form{display:grid;gap:16px;max-width:460px}
.form label{display:grid;gap:6px;font-weight:500}
.form input,.form select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;outline:0;width:100%}
.form input:focus,.form select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:130px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:left}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
td.f{color:var(--muted);font-size:12px;direction:ltr;text-align:left}
td.n{font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;background:rgba(2,6,15,.55);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;z-index:100;padding:20px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.dlg p{margin:0 0 16px}
.dlg-act{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:90vw;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:120;font-size:13px;box-shadow:var(--shadow)}
.backdrop{display:none}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .main{padding:0 14px 32px}
  .menu-btn{display:grid}
  .side{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:50;width:272px;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
  html[dir="rtl"] .side{transform:translateX(105%)}
  .mobile-open .side{transform:none}
  html[dir="rtl"] .mobile-open .side{transform:none}
  .mobile-open .backdrop{display:block;position:fixed;inset:0;background:rgba(2,6,15,.5);z-index:40}
  .collapsed .side{width:272px}
  .collapsed .lbl,.collapsed .brand-txt,.collapsed .ver{display:revert}
  .collapsed .nav button{justify-content:flex-start;padding-inline:12px}
  .side-foot .icon-btn{display:none}
  .tb-mid{display:none}
}
@media (max-width:640px){
  .g4,.g3{grid-template-columns:1fr}
  .page-head{flex-direction:column}
  h1{font-size:22px}
  .tb-end .pill:not(.icon-pill){display:none}
  .card-val{font-size:24px}
}
.btn{display:inline-flex;align-items:center;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 12px}
.toolbar .grow{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.toolbar .grow input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text)}
.sub{font-size:12px;color:var(--muted);direction:ltr;text-align:start}
td.n .sub{direction:inherit;text-align:start;white-space:normal}
.sub.rem{font-size:11px;opacity:.9}
.blsub{direction:inherit;text-align:start}
.blsub .rem{font-size:11.5px;margin-top:2px}
.blsub .neg{color:#d62828;font-weight:700}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500}
.tag.ok{background:var(--chip-green);color:var(--green)}
.tag.off{background:var(--chip-ink);color:var(--muted)}
.tag.warn{background:var(--chip-red);color:var(--red)}
.stk.low{color:var(--red);font-weight:700}
td.neg{color:var(--red)}
td.act{white-space:nowrap;text-align:end}
td.act .icon-btn{display:inline-grid;vertical-align:middle}
.count-note{margin:10px 2px 0;font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.fgrid label,.catadd label{display:grid;gap:6px;font-weight:500}
.fgrid input,.fgrid select,.dlg input.txt{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;outline:0;width:100%}
.fgrid input:focus,.fgrid select:focus,.dlg input.txt:focus{border-color:var(--accent)}
.fgrid .chk{display:flex;align-items:center;gap:8px}
.fgrid .chk input{width:auto}
.dlg.wide{max-width:620px;max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 16px;font-size:18px}
.dlg .sec-sub{margin:18px 0 10px;font-weight:600}
.err{color:var(--red);margin:12px 0 0;font-size:13px;min-height:1.2em}
.catrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.catrow input{flex:1}
.catrow .n{color:var(--muted);font-size:12px;white-space:nowrap}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.gcard{display:flex;flex-direction:column;gap:4px}
.gcard.sel{outline:2px solid var(--accent);outline-offset:-1px}
.gcard h3{margin:0;font-size:16px}
.gact{display:flex;gap:2px;margin:-6px -8px 0 0}
html[dir="rtl"] .gact{margin:-6px 0 0 -8px}
.gstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 14px}
.gstats span{display:block;font-size:12px;color:var(--muted)}
.gstats strong{font-size:15px}
.gcard .btn{align-self:flex-start}
td.sgn-in{color:var(--green);font-weight:600}
td.sgn-out{color:var(--red);font-weight:600}
.avail{font-size:12px;color:var(--muted);font-weight:400}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip-btn{padding:6px 12px;font-size:13px}

.blhead,.blrow{display:grid;grid-template-columns:28px minmax(0,1fr) 110px 130px 130px 40px;gap:10px;align-items:start}
.blhead{color:var(--muted);font-size:12px;font-weight:500;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.blrow{margin-bottom:10px}
.blrow input,.blrow select,.bltotals input,#bl_name,#bl_no,#bl_date,#bl_phone,#bl_addr,.fgrid select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;outline:0;width:100%}
.blrow input:focus,.blrow select:focus,.bltotals input:focus{border-color:var(--accent)}
.blno{color:var(--muted);padding-top:10px;text-align:center}
.bltot{padding-top:9px;text-align:end;font-variant-numeric:tabular-nums}
.bltotals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
.bltotals>div span:first-child,.bltotals label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
.bltotals strong{font-size:18px}.bltotals strong.big{font-size:24px}
@media (max-width:760px){
  .blhead{display:none}
  .blrow{grid-template-columns:1fr 1fr 1fr 34px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
  .blno{display:none}.blitem{grid-column:1/-1}
  .blrow .bltot{padding-top:9px}
}
.dlg.xwide{max-width:640px}
.bill{width:600px;max-width:none;box-sizing:border-box;--bl:#1d5b8f;background:#fff;color:var(--bl);border:3px solid var(--bl);border-radius:6px;padding:14px 16px 12px;font-size:14px;outline:1px solid var(--bl);outline-offset:-8px;text-align:start}
.bill-name{text-align:center;font-size:30px;font-weight:700;line-height:1.35;color:#0f3f68}
.bill-mid{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.bill-txt{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.bill-tag{font-size:20px;font-weight:700;color:#0f3f68}
.bill-info{display:flex;flex-direction:column;gap:6px;align-items:center}
.bill-pill{display:inline-flex;align-items:center;gap:6px;background:var(--bl);color:#fff;border-radius:999px;padding:3px 18px;font-weight:700;font-size:14px}
.bill-logo{width:30%;max-width:170px;height:auto;flex:none;mix-blend-mode:multiply}
.bill-meta{display:flex;align-items:flex-end;gap:14px;margin:12px 0 8px;font-size:13px;flex-wrap:wrap}
.bill-meta .f{white-space:nowrap}
.bill-meta .grow{flex:1;min-width:150px;border-bottom:1.5px dotted var(--bl);padding-bottom:1px}
.bill-meta b{font-weight:700;color:#0f3f68}
.bill-no{color:#d62828!important;font-size:22px;line-height:1}
.bill table{border:2px solid var(--bl);border-collapse:collapse;width:100%;table-layout:fixed}
.bill th,.bill td{border:1.2px solid var(--bl);padding:6px 8px;color:var(--bl);vertical-align:middle;height:48px}
.bill th{height:auto;font-weight:700;font-size:15px;padding:9px 6px;background:none}
.bill td.c,.bill th.c{text-align:center}
.bill td.nm{font-size:15px;text-align:center}
.bill tr.tot td{font-size:16px;height:52px}
.bill .bsub{font-size:11px;color:#47678a;font-weight:400}
.bill-extra{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
.bill-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;font-weight:600}
.bill-foot .grow{flex:1;text-align:center}
.bill-ph{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:18px;color:#0f3f68}
.bill-wt{text-align:center;font-size:12.5px;margin-top:6px}
.bill-fit{overflow:hidden;width:100%}
.lnk{color:inherit;text-decoration:underline;text-underline-offset:3px}
.bill-meta .grow .bsub{white-space:normal;margin-top:2px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start}
@media print{
  @page{size:A5 portrait;margin:8mm}
  html,body{background:#fff!important;height:auto!important}
  body>*:not(.modal){display:none!important}
  .modal{position:static!important;background:none!important;padding:0!important;display:block!important}
  .dlg{box-shadow:none!important;border:0!important;max-width:none!important;max-height:none!important;overflow:visible!important;padding:0!important;background:#fff!important}
  .no-print,.toast{display:none!important}
  .bill{-webkit-print-color-adjust:exact;print-color-adjust:exact;transform:none!important;width:100%!important}
  .bill-fit{height:auto!important;overflow:visible!important}
}
.splrow{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;margin-bottom:8px}
.splrow select,.splrow input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;outline:0;width:100%}
td.n bdi{white-space:nowrap}
.exbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr minmax(120px,auto);gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.exbar .ext{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.exbar .ext i{display:block;height:100%;background:var(--accent);border-radius:999px}
.exbar .exv{text-align:end;color:var(--muted)}

/* part 8 */

<body>
<div id="root"></div>

<script>
/* ===================== DATA LAYER (database + calculations) ===================== */
var RP = (function(){
'use strict';
var LS_KEY='retailpro_db_v1';
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

var TABLES=['godowns','categories','products','stock','stock_moves','customers','suppliers','supplier_tx','staff','staff_tx','sales','sale_items','refunds','customer_payments','expenses','loans','loan_payments','activity_log','trash'];
var SCHEMA={
  godowns:'id, name, location',
  categories:'id, name',
  products:'id, name, sku, barcode, category_id, unit, bag_kg, cost_price, sale_price, min_stock, active',
  stock:'id, product_id, godown_id, qty',
  stock_moves:'id, product_id, godown_id, type (in | out | transfer_in | transfer_out), qty, reason, note, date, ref',
  customers:'id, name, phone, address',
  suppliers:'id, name, phone, company, address',
  supplier_tx:'id, supplier_id, type (purchase | payment), amount, note, date',
  staff:'id, name, role, phone, salary, hired_at',
  staff_tx:'id, staff_id, type (accrual | payment), amount, note, date',
  sales:'id, invoice_no, customer_id, customer_name, godown_id, date, subtotal, discount, total, paid',
  sale_items:'id, sale_id, product_id, qty, price, cost',
  refunds:'id, sale_id, amount, reason, date',
  customer_payments:'id, customer_id, amount, note, date, alloc',
  expenses:'id, category, amount, note, date',
  loans:'id, party, direction (given | taken), amount, paid, date, due_date, note',
  loan_payments:'id, loan_id, amount, note, date',
  activity_log:'id, action, table_name, row_id, at',
  trash:'id, table_name, row, deleted_at'
};

var DB={
  data:null,
  blank:function(){
    var d={version:1,settings:{shopName:'RetailPro',currency:'\u060B',currencyCode:'AFN',openingCash:0,lang:'en',theme:'auto',billShop:'محمدصابر عمده پلورنځی',shopTagline:'نخود، عدس و لوبیا',shopAddress:'باغ قاضی، سرای چقرک دوکان B-142',shopPhone:'0790055104',billNote:'پاملرنه: اخیستل شوي توکي بیرته نه اخیستل کیږي.'},seq:{}};
    TABLES.forEach(function(t){d[t]=[];d.seq[t]=0});
    return d;
  },
  fill:function(d){
    var b=this.blank();
    if(!d.seq||typeof d.seq!=='object')d.seq={};
    TABLES.forEach(function(t){
      if(!Array.isArray(d[t]))d[t]=[];
      if(typeof d.seq[t]!=='number')d.seq[t]=d[t].reduce(function(m,r){return Math.max(m,r.id||0)},0);
    });
    d.settings=Object.assign(b.settings,d.settings||{});
    (function(){
      var SHOP='\u062f\u0648\u06a9\u0627\u0646',MAIN='\u06af\u062f\u0627\u0645';
      var OLD_SHOP=['shop','dukan','\u062f\u06a9\u0627\u0646','\u0641\u0631\u0639\u06cc'],OLD_MAIN=['main','main godown','\u0645\u0631\u06a9\u0632\u06cc'];
      function has(n,id){return d.godowns.some(function(x){return x.id!==id&&String(x.name||'').trim()===n})}
      d.godowns.forEach(function(g){
        var n=String(g.name||'').trim(),l=n.toLowerCase();
        if(OLD_SHOP.indexOf(l)>=0&&!has(SHOP,g.id))g.name=SHOP;
        else if(OLD_MAIN.indexOf(l)>=0&&!has(MAIN,g.id))g.name=MAIN;
      });
    })();
    (function(){
      var mx=600;
      d.products.forEach(function(p){var b=String(p.barcode||'');if(/^\d{3,6}$/.test(b)){var n=parseInt(b,10);if(n>mx)mx=n}});
      d.products.slice().sort(function(a,b){return a.id-b.id}).forEach(function(p){
        if(/^601\d{6}$/.test(String(p.barcode||'')))p.barcode=String(++mx);
      });
    })();
    d.version=1;
    return d;
  },
  load:function(){
    var raw=safeGet(LS_KEY),d=null;
    if(raw){try{d=JSON.parse(raw)}catch(e){d=null}}
    this.data=(d&&typeof d==='object'&&d.version===1)?this.fill(d):this.blank();
  },
  saveFailed:false,
  save:function(){
    var ok=safeSet(LS_KEY,JSON.stringify(this.data));
    this.saveFailed=!ok;
    if(typeof window!=='undefined'&&typeof window.rpSaveStatus==='function'){try{window.rpSaveStatus(ok)}catch(e){}}
    return ok;
  },
  all:function(t){return this.data[t]},
  get:function(t,id){return this.data[t].find(function(r){return r.id===id})||null},
  count:function(t){return this.data[t].length},
  setStock:function(pid,gid,qty,reason){
    var r=this.data.stock.find(function(x){return x.product_id===pid&&x.godown_id===gid});
    var cur=r?r.qty:0;
    if(r){r.qty=qty;this.log('update','stock',r.id);this.save()}
    else r=this.insert('stock',{product_id:pid,godown_id:gid,qty:qty});
    var diff=Math.round((qty-cur)*1000)/1000;
    if(diff!==0)this.insert('stock_moves',{product_id:pid,godown_id:gid,type:diff>0?'in':'out',qty:Math.abs(diff),reason:reason||'',note:'',date:new Date().toISOString(),ref:null});
    return r;
  },
  adjustStock:function(pid,gid,delta,type,note,ref,reason){
    delta=Math.round(delta*1000)/1000;
    var r=this.data.stock.find(function(x){return x.product_id===pid&&x.godown_id===gid});
    var nq=Math.round(((r?r.qty:0)+delta)*1000)/1000;
    if(nq<0||delta===0)return false;
    if(r){r.qty=nq;this.log('update','stock',r.id)}else this.insert('stock',{product_id:pid,godown_id:gid,qty:nq});
    this.insert('stock_moves',{product_id:pid,godown_id:gid,type:type,qty:Math.abs(delta),reason:reason||'',note:note||'',date:new Date().toISOString(),ref:ref||null});
    this.save();return true;
  },
  transfer:function(pid,from,to,qty,note){
    qty=Math.round(qty*1000)/1000;
    var r=this.data.stock.find(function(x){return x.product_id===pid&&x.godown_id===from});
    if(from===to||!(qty>0)||!r||r.qty<qty)return false;
    var ref=this.data.seq.stock_moves+1;
    this.adjustStock(pid,from,-qty,'transfer_out',note,ref);
    this.adjustStock(pid,to,qty,'transfer_in',note,ref);
    return true;
  },
  nextSku:function(){
    var m=0;
    this.data.products.forEach(function(p){var x=/^P-(\d+)$/.exec(p.sku||'');if(x)m=Math.max(m,+x[1])});
    return 'P-'+String(m+1).padStart(3,'0');
  },
  log:function(action,t,id){
    if(t==='activity_log'||t==='trash')return;
    var L=this.data.activity_log;
    L.push({id:++this.data.seq.activity_log,action:action,table_name:t,row_id:id,at:new Date().toISOString()});
    if(L.length>500)L.splice(0,L.length-500);
  },
  insert:function(t,row){
    var r=Object.assign({},row);
    r.id=++this.data.seq[t];
    if(!r.created_at)r.created_at=new Date().toISOString();
    this.data[t].push(r);
    this.log('insert',t,r.id);this.save();return r;
  },
  update:function(t,id,patch){
    var r=this.get(t,id);if(!r)return null;
    Object.assign(r,patch,{updated_at:new Date().toISOString()});
    this.log('update',t,id);this.save();return r;
  },
  remove:function(t,id){
    var i=this.data[t].findIndex(function(r){return r.id===id});
    if(i<0)return false;
    var row=this.data[t].splice(i,1)[0];
    var D=this.data;
    if(t==='customers'){
      D.sales.forEach(function(x){if(x.customer_id===id){x.orig_customer_id=id;x.customer_id=null;if(!x.customer_name)x.customer_name=row.name||''}});
      D.customer_payments.forEach(function(x){if(x.customer_id===id){x.orig_customer_id=id;x.customer_name=x.customer_name||row.name||''}});
    }
    D.trash.push({id:++D.seq.trash,table_name:t,row:row,deleted_at:new Date().toISOString()});
    if(D.trash.length>200)D.trash.splice(0,D.trash.length-200);
    this.log('delete',t,id);this.save();return true;
  },
  restore:function(trashId){
    var i=this.data.trash.findIndex(function(r){return r.id===trashId});
    if(i<0)return false;
    var x=this.data.trash.splice(i,1)[0];
    this.data[x.table_name].push(x.row);
    if(x.table_name==='customers'){
      var rid=x.row.id;
      this.data.sales.forEach(function(s){if(s.orig_customer_id===rid&&!s.customer_id){s.customer_id=rid;delete s.orig_customer_id}});
      this.data.customer_payments.forEach(function(p){if(p.orig_customer_id===rid)delete p.orig_customer_id});
    }
    this.log('restore',x.table_name,x.row.id);this.save();return true;
  },
  exportText:function(){return JSON.stringify(this.data,null,2)},
  importText:function(text){
    var d;
    try{d=JSON.parse(text)}catch(e){return false}
    if(!d||typeof d!=='object'||d.version!==1)return false;
    for(var i=0;i<TABLES.length;i++){
      var rows=d[TABLES[i]];
      if(rows===undefined)continue;
      if(!Array.isArray(rows))return false;
      var seen={};
      for(var j=0;j<rows.length;j++){
        var r=rows[j];
        if(!r||typeof r!=='object'||Array.isArray(r))return false;
        if(typeof r.id!=='number'||!isFinite(r.id)||seen[r.id])return false;
        seen[r.id]=1;
      }
    }
    this.data=this.fill(d);this.save();return true;
  },
  clearAll:function(){
    var s=this.data.settings;
    this.data=this.blank();
    this.data.settings=Object.assign(this.data.settings,s);
    this.save();
  },
  loadDemo:function(){
    this.data=buildDemo(this.data.settings);
    this.save();
  }
};

/* ---------- demo data ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function salePrice(p){return p[4]}

function buildDemo(oldSettings){
  var d=DB.blank();
  d.settings=Object.assign(d.settings,oldSettings,{openingCash:300000});
  var R=rng(20260820);
  function ri(a,b){return a+Math.floor(R()*(b-a+1))}
  var now=Date.now(),DAY=864e5;
  function add(t,row){var r=Object.assign({},row);r.id=++d.seq[t];if(!r.created_at)r.created_at=new Date().toISOString();d[t].push(r);return r}
  function ago(n){return new Date(now-n*DAY).toISOString()}

  add('godowns',{name:'\u06AF\u062F\u0627\u0645',location:'Kabul'});
  add('godowns',{name:'\u062F\u0648\u06A9\u0627\u0646',location:'Kabul'});

  var cats=['حبوبات'];
  cats.forEach(function(n){add('categories',{name:n})});

  // [name, category, unit, cost, sale, min]
  var P=[
    ['نخود ۸ ملی',1,'bag',4750,5750,10,25],
    ['نخود ۹ ملی',1,'bag',4250,5250,10,25],
    ['عدس',1,'bag',3500,4250,10,25],
    ['لوبیا',1,'bag',2750,3375,10,25]
  ];
  P.forEach(function(p,i){add('products',{name:p[0],sku:'P-'+String(i+1).padStart(3,'0'),barcode:String(601+i),category_id:p[1],unit:p[2],bag_kg:p[6],cost_price:p[3],sale_price:salePrice(p),min_stock:p[5],active:true})});

  var custNames=['\u0627\u062D\u0645\u062F \u0648\u0644\u06CC','\u0645\u0631\u06CC\u0645 \u0631\u062D\u06CC\u0645\u06CC','\u0639\u0628\u062F\u0627\u0644\u0644\u0647 \u0646\u0648\u0631\u06CC','\u0641\u0627\u0637\u0645\u0647 \u0635\u062F\u06CC\u0642\u06CC','\u0645\u062D\u0645\u062F \u06CC\u0627\u0633\u06CC\u0646','\u0632\u06CC\u0646\u0628 \u06A9\u0631\u06CC\u0645\u06CC','\u062D\u0628\u06CC\u0628\u200C\u0627\u0644\u0644\u0647','\u0646\u062C\u06CC\u0628\u0647'];
  custNames.forEach(function(n,i){add('customers',{name:n,phone:'07'+(0+ri(0,9))+String(ri(1000000,9999999)),address:'Kabul'})});

  var supNames=['\u0634\u0631\u06A9\u062A \u067E\u0627\u0645\u06CC\u0631','\u062A\u062C\u0627\u0631\u062A \u062E\u0631\u0627\u0633\u0627\u0646','\u0645\u0648\u0627\u062F \u063A\u0630\u0627\u06CC\u06CC \u0647\u06CC\u0631\u0645\u0646\u062F','\u0644\u0648\u0627\u0632\u0645 \u0628\u0631\u0642\u06CC \u06A9\u0627\u0628\u0644'];
  supNames.forEach(function(n){add('suppliers',{name:n,phone:'07'+ri(10000000,99999999),company:n,address:'Kabul'})});
  var ST=[[1,'purchase',600000,70],[1,'purchase',400000,40],[1,'purchase',300000,12],[1,'payment',450000,35],[1,'payment',250000,8],
          [2,'purchase',225000,55],[2,'purchase',150000,20],[2,'payment',225000,30],
          [3,'purchase',350000,48],[3,'payment',350000,25],
          [4,'purchase',100000,60],[4,'payment',125000,18]];
  ST.forEach(function(x){add('supplier_tx',{supplier_id:x[0],type:x[1],amount:x[2],note:'',date:ago(x[3])})});

  var staffList=[['\u0633\u0645\u06CC\u0639\u200C\u0627\u0644\u0644\u0647','Sales',8000],['\u0646\u0631\u06AF\u0633','Accountant',10000],['\u0631\u062D\u0645\u062A','Storekeeper',7000]];
  staffList.forEach(function(s){add('staff',{name:s[0],role:s[1],phone:'07'+ri(10000000,99999999),salary:s[2],hired_at:ago(300)})});
  var nd=new Date();
  staffList.forEach(function(s,i){
    for(var m=3;m>=0;m--){
      var ds=new Date(nd.getFullYear(),nd.getMonth()-m,1,9).toISOString();
      add('staff_tx',{staff_id:i+1,type:'accrual',amount:s[2],note:'',date:ds});
      var full=m>0;
      add('staff_tx',{staff_id:i+1,type:'payment',amount:full?s[2]:Math.round(s[2]/2),note:'',date:new Date(new Date(ds).getTime()+2*3600e3).toISOString()});
    }
  });

  // sales
  var soldBy={};
  var raw=[];
  for(var i=0;i<120;i++){raw.push(now-Math.floor(R()*80)*DAY-ri(0,10)*36e5)}
  raw.sort(function(a,b){return a-b});
  var activeIdx=[];P.forEach(function(p,i){activeIdx.push(i)});
  var saleRows=[];
  raw.forEach(function(ts,n){
    var cnt=ri(1,4),picked=[];
    while(picked.length<cnt){var k=activeIdx[ri(0,activeIdx.length-1)];if(picked.indexOf(k)<0)picked.push(k)}
    var gid=R()<0.7?1:2,subtotal=0,items=[];
    picked.forEach(function(k){var q=ri(1,4),p=P[k];subtotal+=q*salePrice(p);items.push({product_id:k+1,qty:q,price:salePrice(p),cost:p[3]});soldBy[k+'_'+gid]=(soldBy[k+'_'+gid]||0)+q});
    var discount=R()<0.3?Math.round(subtotal*0.03/5)*5:0,total=subtotal-discount;
    var cust=R()<0.65?ri(1,custNames.length):null,paid=total;
    if(cust){var r=R();paid=r<0.7?total:(r<0.9?Math.round(total*ri(40,90)/100):0)}
    var s=add('sales',{invoice_no:String(n+1),customer_id:cust,godown_id:gid,date:new Date(ts).toISOString(),subtotal:subtotal,discount:discount,total:total,paid:paid});
    saleRows.push(s);
    items.forEach(function(it){add('sale_items',Object.assign({sale_id:s.id},it))});
  });
  var big=saleRows.filter(function(s){return s.total>1500});
  [0,1].forEach(function(i){var s=big[i*3]||big[i];if(s)add('refunds',{sale_id:s.id,amount:Math.round(s.total*0.1/5)*5,reason:'Damaged item',date:s.date})});

  // stock
  P.forEach(function(p,i){
    [1,2].forEach(function(g){
      var base=g===1?ri(60,200):ri(15,50),qty=base+(soldBy[i+'_'+g]||0);
      if(i===3)qty=g===1?3:1;
      add('stock',{product_id:i+1,godown_id:g,qty:qty});
    });
  });

  add('stock_moves',{product_id:1,godown_id:1,type:'in',qty:60,reason:'purchase',note:'',date:ago(40),ref:null});
  add('stock_moves',{product_id:2,godown_id:1,type:'in',qty:40,reason:'purchase',note:'',date:ago(28),ref:null});
  add('stock_moves',{product_id:3,godown_id:1,type:'transfer_out',qty:10,reason:'',note:'',date:ago(15),ref:1});
  add('stock_moves',{product_id:3,godown_id:2,type:'transfer_in',qty:10,reason:'',note:'',date:ago(15),ref:1});
  add('stock_moves',{product_id:4,godown_id:1,type:'out',qty:1,reason:'damaged',note:'',date:ago(6),ref:null});

  // expenses
  [['Shop rent',15000,75],['Shop rent',15000,45],['Shop rent',15000,15],['Electricity',2200,40],['Electricity',2400,10],['Internet',1500,20],
   ['Transport',900,5],['Transport',1200,33],['Cleaning',600,12],['Tea & snacks',450,3],['Maintenance',3200,27],['Packaging',1800,50]]
   .forEach(function(e){add('expenses',{category:e[0],amount:e[1],note:'',date:ago(e[2])})});

  add('loans',{party:'\u062D\u0627\u062C\u06CC \u0638\u0627\u0647\u0631',direction:'taken',amount:50000,paid:20000,date:ago(60),due_date:ago(-30),note:''});
  add('loans',{party:'\u0647\u0645\u0633\u0627\u06CC\u0647',direction:'given',amount:5000,paid:0,date:ago(14),due_date:ago(-15),note:''});

  d.activity_log.push({id:++d.seq.activity_log,action:'demo',table_name:'*',row_id:0,at:new Date().toISOString()});
  return d;
}

/* ---------- calculations ---------- */
function sum(arr,fn){var s=0;for(var i=0;i<arr.length;i++)s+=fn(arr[i]);return Math.round(s*1e6)/1e6}
function periodStart(p){
  var n=new Date();
  if(p==='today')return new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(p==='weekly')return new Date(Date.now()-7*864e5);
  if(p==='monthly')return new Date(Date.now()-30*864e5);
  if(p==='yearly')return new Date(Date.now()-365*864e5);
  return null;
}
function productStock(D,gid){
  var m={};
  D.stock.forEach(function(r){if(gid==='all'||r.godown_id===gid)m[r.product_id]=(m[r.product_id]||0)+r.qty});
  return m;
}
function compute(D,period,gid){
  var from=periodStart(period);
  function inR(iso){return !from||new Date(iso)>=from}
  function gOK(g){return gid==='all'||g===gid}
  var sales=D.sales.filter(function(s){return inR(s.date)&&gOK(s.godown_id)});
  var costBy={};D.sale_items.forEach(function(i){costBy[i.sale_id]=(costBy[i.sale_id]||0)+i.cost*i.qty});
  var saleById={};D.sales.forEach(function(s){saleById[s.id]=s});
  var revenue=sum(sales,function(s){return s.total});
  var gross=sum(sales,function(s){return s.total-(costBy[s.id]||0)});
  var pending=sum(sales,function(s){return s.total-s.paid});

  var staffPayable=0;var stIds={};D.staff.forEach(function(x){stIds[x.id]=1});Object.keys(due).forEach(function(k){if(stIds[k]&&due[k]>0)staffPayable+=due[k]});

function render(keepScroll){
  try{renderInner(keepScroll)}
  catch(err){
    root.innerHTML='<div style="padding:24px;font-family:system-ui,sans-serif;max-width:760px"><h2>Something went wrong / \u0645\u0634\u06A9\u0644\u06CC \u067E\u06CC\u0634 \u0622\u0645\u062F</h2><pre style="white-space:pre-wrap;background:#fee2e2;padding:12px;border-radius:8px;direction:ltr;text-align:left">'+esc(err&&err.stack?err.stack:err)+'</pre><button id="errEn" style="padding:10px 16px">English</button> <button id="errDash" style="padding:10px 16px">Dashboard</button></div>';
    document.documentElement.dir='ltr';
    document.getElementById('errEn').onclick=function(){try{DB.data.settings.lang='en';DB.save()}catch(e){}state.view='dashboard';render(false)};
    document.getElementById('errDash').onclick=function(){state.view='dashboard';render(false)};
    try{console.error(err)}catch(e){}
  }
}
function renderInner(keepScroll){
  var m=document.getElementById('main'),st=m?m.scrollTop:0;
  applyLook();
  var body=state.view==='dashboard'?dashboardView():(state.view==='settings'?settingsView():(state.view==='products'?productsView():(state.view==='godown'?godownView():(state.view==='customers'?customersView():(state.view==='staff'?staffView():(state.view==='billing'?billingView():(state.view==='sales'?salesView():(state.view==='suppliers'?suppliersView():(state.view==='expenses'?expensesView():(state.view==='loans'?loansView():(state.view==='financials'?financialsView():(state.view==='reports'?reportsView():(state.view==='recycle'?recycleView():soonView())))))))))))));
  root.innerHTML='<div class="app'+(state.collapsed?' collapsed':'')+(state.mobile?' mobile-open':'')+'">'+sidebar()+'<main class="main" id="main">'+topbar()+'<div class="page">'+body+'</div></main></div>';
  var m2=document.getElementById('main');
  if(m2)m2.scrollTop=keepScroll?st:0;

function toast(msg){
  var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;
  document.body.appendChild(el);setTimeout(function(){el.remove()},2200);
}
function confirmBox(msg){
  return new Promise(function(res){
    var o=document.createElement('div');o.className='modal';
    o.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><p>'+esc(msg)+'</p><div class="dlg-act"><button class="btn" data-r="0">'+esc(t('cancel'))+'</button><button class="btn btn-primary" data-r="1">'+esc(t('confirm'))+'</button></div></div>';
    o.addEventListener('click',function(e){var b=e.target.closest('[data-r]');if(b||e.target===o){o.remove();res(!!b&&b.dataset.r==='1')}});
    document.body.appendChild(o);o.querySelector('[data-r="1"]').focus();
  });
}

var UNITS=['pcs','kg','bag','can','pack','bottle','box','liter','meter','dozen'];
var PSUM=[{k:'sum_total',tone:'ink',icon:'package'},{k:'active_products',tone:'green',icon:'package'},{k:'sum_low',tone:'red',icon:'bell'},{k:'stock_value',tone:'amber',icon:'warehouse',money:1}];
function unitLabel(u){var v=t('unit_'+u);return v==='unit_'+u?u:v}
function unitFull(p){var u=unitLabel(p.unit);return p.unit==='bag'&&p.bag_kg>0?u+' '+qtyFmt(p.bag_kg)+' '+t('unit_kg'):u}
function weightKg(p,q){var k=p.unit==='bag'&&p.bag_kg>0?q*p.bag_kg:(p.unit==='kg'?q:0);return Math.round(k*1000)/1000}
function tonFmt(kg){return qtyFmt(kg/1000)}
function kgText(p,q){
  var isBag=p.unit==='bag'&&p.bag_kg>0;
  if(!isBag&&p.unit!=='kg')return '';
  var k=weightKg(p,q);
  return '= '+(isBag?qtyFmt(k)+' '+t('unit_kg')+' = ':'')+tonFmt(k)+' '+t('unit_ton');
}
function kgSub(p,q){
  var isBag=p.unit==='bag'&&p.bag_kg>0;
  if(!isBag&&p.unit!=='kg')return '';
  var k=weightKg(p,q),h='';
  if(isBag)h+='<div class="sub"><bdi dir="ltr">'+esc(qtyFmt(k)+' '+t('unit_kg'))+'</bdi></div>';
  var tons=Math.floor(k/1000+1e-9),rem=Math.round((k-tons*1000)*1000)/1000;
  if(tons<1)return h;
  h+='<div class="sub"><bdi dir="ltr">'+esc(qtyFmt(tons)+' '+t('unit_ton'))+'</bdi></div>';
  if(rem>0){
    var rt=qtyFmt(rem)+' '+t('unit_kg');
    if(isBag)rt+=' ('+qtyFmt(Math.round(rem/p.bag_kg*1000)/1000)+' '+unitLabel('bag')+')';
    h+='<div class="sub rem">'+esc(t('remainder'))+': <bdi dir="ltr">'+esc(rt)+'</bdi></div>';
  }
  return h;
}
function qtyText(p,q){var k=kgText(p,q);return qtyFmt(q)+' '+unitLabel(p.unit)+(k?' ('+k+')':'')}
function availText(pid,gid){var pr=DB.get('products',pid),q=avail(pid,gid);return t('tf_avail').replace('{n}',pr?qtyText(pr,q):qtyFmt(q))}
function qtyFmt(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:3})}
function productTotals(){var m={};DB.data.stock.forEach(function(r){m[r.product_id]=(m[r.product_id]||0)+r.qty});return m}
function prodFilter(){
  var D=DB.data,q=state.pq.trim().toLowerCase(),tot=productTotals();
  return D.products.filter(function(p){
    if(state.pcat!=='all'&&String(p.category_id||'')!==String(state.pcat))return false;
    var low=p.active&&(tot[p.id]||0)<=p.min_stock;
    if(state.pstat==='active'&&!p.active)return false;
    if(state.pstat==='inactive'&&p.active)return false;
    if(state.pstat==='low'&&!low)return false;
    if(q&&(p.name||'').toLowerCase().indexOf(q)<0&&(p.sku||'').toLowerCase().indexOf(q)<0&&(p.barcode||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
}
function productRows(list){
  var D=DB.data,tot=productTotals(),perG={},cat={},gname={},sp=showPrices();
  D.stock.forEach(function(r){(perG[r.product_id]=perG[r.product_id]||[]).push(r)});
  D.categories.forEach(function(c){cat[c.id]=c.name});
  D.godowns.forEach(function(g){gname[g.id]=g.name});
  if(!list.length)return '<tr><td colspan="'+(sp?9:6)+'" class="muted" style="text-align:center;padding:24px">'+esc(t('no_results'))+'</td></tr>';
  return list.slice(0,200).map(function(p){
    var q=tot[p.id]||0,low=p.active&&q<=p.min_stock,profit=p.sale_price-p.cost_price,pct=p.cost_price>0?Math.round(profit/p.cost_price*100):0;
    var tip=(perG[p.id]||[]).map(function(r){return (gname[r.godown_id]||'?')+': '+qtyFmt(r.qty)}).join(' | ');
    return '<tr><td><strong>'+esc(p.name)+'</strong>'+(p.barcode?'<div class="sub"><bdi dir="ltr">'+esc(p.barcode)+'</bdi></div>':'')+'</td>'
     +'<td>'+esc(cat[p.category_id]||'\u2014')+'</td><td>'+esc(unitFull(p))+'</td>'
     +(sp?'<td class="n"><bdi dir="ltr">'+fmt(p.cost_price)+'</bdi></td><td class="n"><bdi dir="ltr">'+fmt(p.sale_price)+'</bdi></td>'
     +'<td class="n'+(profit<0?' neg':'')+'"><bdi dir="ltr">'+fmt(profit)+' ('+pct+'%)</bdi></td>':'')
     +'<td class="n" title="'+esc(tip)+'"><span class="stk'+(low?' low':'')+'"><bdi dir="ltr">'+qtyFmt(q)+'</bdi></span>'+kgSub(p,q)+'</td>'
     +'<td><span class="tag '+(p.active?'ok':'off')+'">'+esc(t(p.active?'active':'inactive'))+'</span>'+(low?' <span class="tag warn">'+esc(t('low'))+'</span>':'')+'</td>'
     +'<td class="act"><button class="icon-btn" data-act="pedit" data-id="'+p.id+'" aria-label="'+esc(t('edit'))+'">'+ic('edit')+'</button><button class="icon-btn" data-act="pdel" data-id="'+p.id+'" aria-label="'+esc(t('delete'))+'">'+ic('trash')+'</button></td></tr>';
  }).join('');
}
function countNote(list){return list.length>200?t('showing').replace('{a}',200).replace('{b}',list.length):''}
function refreshProductList(){
  var b=document.getElementById('prodBody');if(!b)return;
  var list=prodFilter();b.innerHTML=productRows(list);
  var n=document.getElementById('prodCount');if(n)n.textContent=countNote(list);

function productsView(){
  var D=DB.data,c=RP.compute(D,'lifetime','all');
  var vals={sum_total:D.products.length,active_products:c.active_products,sum_low:RP.lowStock(D).length,stock_value:c.stock_value};
  var head='<div class="page-head"><div><h1>'+esc(t('prod_title'))+'</h1><p class="muted">'+esc(t('prod_sub'))+'</p></div>'

   +'<label>'+esc(t('barcode'))+'<input id="pf_bc" dir="ltr" inputmode="numeric" value="'+esc(p?p.barcode:nextBarcode())+'"></label>'
   +'<label>'+esc(t('category'))+'<select id="pf_cat">'+cOpts+'</select></label>'
   +'<label>'+esc(t('unit'))+'<select id="pf_unit">'+uOpts+'</select></label>'

   +'<div class="chips">'+[25,24.5,50].map(function(w){return '<button type="button" class="btn chip-btn" data-w="'+w+'">'+w+' '+esc(t('unit_kg'))+'</button>'}).join('')+'</div><p class="avail" style="margin:8px 0 0">'+esc(t('bag_hint'))+'</p></div>'
   +'<label class="full" id="pf_newrow" style="display:none">'+esc(t('new_cat_ph'))+'<input id="pf_newcat" autocomplete="off"></label>'
   +'<label>'+esc(t('cost_price'))+' ('+esc(S().currency)+')<input id="pf_cost" type="number" inputmode="decimal" min="0" step="any" value="'+(p?p.cost_price:0)+'"></label>'
   +'<label>'+esc(t('sale_price'))+' ('+esc(S().currency)+')<input id="pf_sale" type="number" inputmode="decimal" min="0" step="any" value="'+(p?p.sale_price:0)+'"></label>'
   +'<label>'+esc(t('min_stock'))+'<input id="pf_min" type="number" inputmode="decimal" min="0" step="any" value="'+(p?p.min_stock:0)+'"></label>'
   +'<label class="chk" style="align-self:end;padding-bottom:10px"><input id="pf_active" type="checkbox"'+((!p||p.active)?' checked':'')+'>'+esc(t('is_active'))+'</label>'
   +'</div><div class="sec-sub">'+esc(t('col_stock'))+'</div><div class="fgrid">'+gInputs+'</div>'
   +'<p class="err" id="pf_err" role="alert"></p>'
   +'<div class="dlg-act"><button class="btn" data-r="x">'+esc(t('cancel'))+'</button><button class="btn btn-primary" data-r="save">'+esc(t('save'))+'</button></div>',true);

    if(e.target.id==='pf_cat'){$('pf_newrow').style.display=e.target.value==='__new'?'grid':'none'}
    if(e.target.id==='pf_unit'){$('pf_bagrow').style.display=e.target.value==='bag'?'block':'none'}
  });
  o.addEventListener('click',function(e){
    var w=e.target.closest('[data-w]');if(w){$('pf_bag').value=w.dataset.w;return}
    var b=e.target.closest('[data-r]');
    if(e.target===o||(b&&b.dataset.r==='x')){o.close();return}
    if(!b||b.dataset.r!=='save')return;
    var D2=DB.data,name=$('pf_name').value.trim(),sku=$('pf_sku').value.trim(),bc=$('pf_bc').value.trim();
    var cost=numVal($('pf_cost').value),sale=numVal($('pf_sale').value),min=numVal($('pf_min').value),err='';
    var badStock=false;o.querySelectorAll('.pf_g').forEach(function(i){var v=numVal(i.value);if(!(v>=0))badStock=true});
    if(!name)err=t('err_name');
    else if(!(cost>=0)||!(sale>=0)||!(min>=0)||badStock)err=t('err_price');
    else if($('pf_unit').value==='bag'&&!(numVal($('pf_bag').value)>0))err=t('err_bag');
    else if(sku&&D2.products.some(function(x){return x.sku===sku&&(!p||x.id!==p.id)}))err=t('err_sku');
    else if(bc&&D2.products.some(function(x){return x.barcode===bc&&(!p||x.id!==p.id)}))err=t('err_barcode');
    $('pf_err').textContent=err;
    if(err){var f=$('pf_name');if(!name)f.focus();return}
    var commit=function(){
      var catId=$('pf_cat').value?Number($('pf_cat').value):null;
      if($('pf_cat').value==='__new'){
        var nn=$('pf_newcat').value.trim();catId=null;
        if(nn){var ex=D2.categories.find(function(c){return c.name.toLowerCase()===nn.toLowerCase()});catId=ex?ex.id:DB.insert('categories',{name:nn}).id}
      }
      var row={name:name,sku:sku||DB.nextSku(),barcode:bc||(p?'':nextBarcode()),category_id:catId,unit:$('pf_unit').value,bag_kg:$('pf_unit').value==='bag'?numVal($('pf_bag').value):0,cost_price:cost,sale_price:sale,min_stock:min,active:$('pf_active').checked};
      var saved=p?DB.update('products',p.id,row):DB.insert('products',row);
      o.querySelectorAll('.pf_g').forEach(function(i){DB.setStock(saved.id,Number(i.dataset.g),numVal(i.value),p?'edit':'opening')});
      o.close();render(true);toast(t('saved_product'));
    };
    if(sale<cost){confirmBox(t('warn_loss')).then(function(ok){if(ok)commit()})}else commit();
  });
  $('pf_name').focus();
}

function deleteProduct(id){
  var D=DB.data,p=DB.get('products',id);if(!p)return;
  var n=D.sale_items.filter(function(i){return i.product_id===id}).length;
  if(n){toast(t('delete_blocked').replace('{n}',n));return}
  confirmBox(t('delete_confirm').replace('{name}',p.name)).then(function(ok){
    if(!ok)return;
    DB.data.stock.filter(function(r){return r.product_id===id}).map(function(r){return r.id}).forEach(function(sid){DB.remove('stock',sid)});
    DB.remove('products',id);render(true);toast(t('deleted_product'));
  });
}

function openCategories(){

     +'<div class="dlg-act" style="margin-top:18px"><button class="btn" data-cclose="1">'+esc(t('close'))+'</button></div>';

  });

function fmtDate(iso){var d=new Date(iso);if(isNaN(d))return '';function z(n){return String(n).padStart(2,'0')}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())}
function stockMap(){var m={};DB.data.stock.forEach(function(r){(m[r.product_id]=m[r.product_id]||{})[r.godown_id]=r.qty});return m}
function avail(pid,gid){var r=DB.data.stock.find(function(x){return x.product_id===pid&&x.godown_id===gid});return r?r.qty:0}
function godownStats(gid){
  var prod={},n=0,q=0,v=0,kg=0;
  DB.data.products.forEach(function(p){prod[p.id]=p});
  DB.data.stock.forEach(function(r){
    if(r.godown_id!==gid)return;var p=prod[r.product_id];if(!p||!p.active)return;
    if(r.qty>0)n++;q+=r.qty;v+=r.qty*p.cost_price;kg+=weightKg(p,r.qty);
  });
  return {n:n,q:q,v:v,kg:kg};
}
function nextBarcode(){
  var mx=600;
  DB.data.products.forEach(function(p){var b=String(p.barcode||'');if(/^\d{3,6}$/.test(b)){var n=parseInt(b,10);if(n>mx)mx=n}});
  return String(mx+1);
}
function sortedProducts(){return DB.data.products.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name))})}
function productOptions(sel){return sortedProducts().map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')}
function godownOptions(sel){return DB.data.godowns.map(function(g){return '<option value="'+g.id+'"'+(g.id===sel?' selected':'')+'>'+esc(g.name)+'</option>'}).join('')}

function gFilter(){
  var q=state.gq.trim().toLowerCase();
  return sortedProducts().filter(function(p){return !q||(p.name||'').toLowerCase().indexOf(q)>=0||(p.sku||'').toLowerCase().indexOf(q)>=0||(p.barcode||'').toLowerCase().indexOf(q)>=0});
}
function godownCols(){return state.gsel==='all'?4+DB.data.godowns.length:6}
function godownRows(list){
  var D=DB.data,sm=stockMap(),gs=state.gsel;
  if(!list.length)return '<tr><td colspan="'+godownCols()+'" class="muted" style="text-align:center;padding:24px">'+esc(t('no_results'))+'</td></tr>';
  return list.slice(0,200).map(function(p){
    var per=sm[p.id]||{},tot=0;Object.keys(per).forEach(function(k){tot+=per[k]});
    var low=p.active&&tot<=p.min_stock,cells;
    if(gs==='all'){
      cells=D.godowns.map(function(g){return '<td class="n"><bdi dir="ltr">'+qtyFmt(per[g.id]||0)+'</bdi></td>'}).join('')
        +'<td class="n"><span class="stk'+(low?' low':'')+'"><bdi dir="ltr">'+qtyFmt(tot)+'</bdi></span>'+kgSub(p,tot)+'</td>';
    }else{
      var q=per[gs]||0;
      cells='<td class="n"><span class="stk'+(low?' low':'')+'"><bdi dir="ltr">'+qtyFmt(q)+'</bdi></span>'+kgSub(p,q)+'</td><td class="n"><bdi dir="ltr">'+qtyFmt(p.min_stock)+'</bdi></td><td class="n"><bdi dir="ltr">'+fmt(q*p.cost_price)+'</bdi></td>';
    }
    var g=gs==='all'?'':gs;
    return '<tr><td><strong>'+esc(p.name)+'</strong>'+(p.barcode||!p.active?'<div class="sub">'+(p.barcode?'<bdi dir="ltr">'+esc(p.barcode)+'</bdi>':'')+(p.barcode&&!p.active?' \u00B7 ':'')+(p.active?'':esc(t('inactive')))+'</div>':'')+'</td><td>'+esc(unitFull(p))+'</td>'+cells
     +'<td class="act"><button class="icon-btn" data-act="gtransfer" data-p="'+p.id+'" data-g="'+g+'" aria-label="'+esc(t('transfer'))+'">'+ic('transfer')+'</button><button class="icon-btn" data-act="gadjust" data-p="'+p.id+'" data-g="'+g+'" aria-label="'+esc(t('adjust_stock'))+'">'+ic('edit')+'</button></td></tr>';
  }).join('');

function moneyTxt(v){return fmt(v)+' '+S().currency}
function todayInput(){var d=new Date();function z(n){return String(n).padStart(2,'0')}return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function sortByName(a,b){return String(a.name).localeCompare(String(b.name))}
function matchText(q,arr){return arr.some(function(v){return String(v||'').toLowerCase().indexOf(q)>=0})}

/* ---- customers ---- */
function custMap(){
  var m={};
  DB.data.sales.forEach(function(s){
    if(s.customer_id==null)return;
    var x=m[s.customer_id]||(m[s.customer_id]={bills:0,billed:0,paid:0,due:0});
    x.bills++;x.billed+=s.total;x.paid+=s.paid;
  });
  Object.keys(m).forEach(function(k){m[k].due=Math.round((m[k].billed-m[k].paid)*100)/100});
  return m;
}
function custStat(m,id){return m[id]||{bills:0,billed:0,paid:0,due:0}}
function custFilter(m){
  var q=state.cq.trim().toLowerCase();
  return DB.data.customers.filter(function(c){
    if(q&&!matchText(q,[c.name,c.phone]))return false;
    if(state.cstat==='owing'&&!(custStat(m,c.id).due>0))return false;
    return true;
  }).sort(sortByName);
}
function mapUrl(a){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)}
function contactHTML(c){
  var h='';
  if(c.phone)h+='<a class="lnk" dir="ltr" href="tel:'+esc(String(c.phone).replace(/[^\d+]/g,''))+'">'+esc(c.phone)+'</a>';
  if(c.address)h+=(h?' \u00B7 ':'')+'<a class="lnk" dir="auto" target="_blank" rel="noopener" href="'+esc(mapUrl(c.address))+'">'+esc(c.address)+'</a>';
  return h;
}

function openCustomerPay(id){
  var c=DB.get('customers',id);if(!c)return;
  var due=custStat(custMap(),id).due;
  if(!(due>0)){toast(t('cu_pay_none'));return}
  var o=openModal('<h3>'+esc(t('cu_pay_title').replace('{name}',c.name))+'</h3><div class="fgrid">'
   +'<label>'+esc(t('amount_l'))+' <span class="avail">('+esc(t('cu_pay_owes').replace('{n}',moneyTxt(due)))+')</span><input id="cp_amt" type="number" inputmode="decimal" min="0" step="any" value="'+round2(due)+'"></label>'
   +'<label>'+esc(t('tf_note'))+'<input id="cp_note" autocomplete="off"></label></div>'
   +'<p class="err" id="cp_err" role="alert"></p><div class="dlg-act"><button class="btn" data-r="x">'+esc(t('cancel'))+'</button><button class="btn btn-primary" data-r="save">'+esc(t('cu_receive'))+'</button></div>');
  var $=function(i){return o.querySelector('#'+i)};
  o.addEventListener('click',function(e){
    var b=e.target.closest('[data-r]');
    if(e.target===o||(b&&b.dataset.r==='x')){o.close();return}
    if(!b||b.dataset.r!=='save')return;
    var amt=numVal($('cp_amt').value),cur=custStat(custMap(),id).due,err='';
    if(!(amt>0))err=t('cu_err_amt');
    else if(amt>cur+0.005)err=t('cu_err_over').replace('{n}',moneyTxt(cur));
    $('cp_err').textContent=err;if(err)return;
    var left=amt,al=[];
    DB.data.sales.filter(function(s){return s.customer_id===id&&s.total>s.paid}).sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:a.id-b.id)}).forEach(function(s){
      if(left<=0)return;
      var take=Math.min(left,s.total-s.paid);
      DB.update('sales',s.id,{paid:Math.round((s.paid+take)*100)/100});al.push({sale_id:s.id,amt:Math.round(take*100)/100});left-=take;
    });
    DB.insert('customer_payments',{customer_id:id,amount:amt,note:$('cp_note').value.trim(),date:new Date().toISOString(),alloc:al});
    o.close();render(true);toast(t('cu_pay_ok'));

function invNo(v){var m=/^INV[-\s]*0*(\d+)$/i.exec(String(v==null?'':v));return m?m[1]:String(v==null?'':v)}
function nextInvoice(){
  var mx=0;DB.data.sales.forEach(function(x){var m=/(\d+)\s*$/.exec(String(x.invoice_no||''));if(m)mx=Math.max(mx,parseInt(m[1],10))});
  return String(mx+1);
}
function newBill(){var g=DB.data.godowns[0];return {no:nextInvoice(),name:'',phone:'',addr:'',date:todayInput(),gid:g?g.id:0,disc:'',paid:'',rows:[{pid:0,qty:'',price:''}],err:''}}
function fnum(v){var n=parseFloat(v);return isFinite(n)?n:0}
function billTotals(){
  var b=state.bill,sub=0;
  b.rows.forEach(function(r){if(r.pid)sub+=Math.round(fnum(r.qty)*fnum(r.price)*100)/100});
  sub=Math.round(sub*100)/100;
  var disc=fnum(b.disc),total=Math.round((sub-disc)*100)/100;
  var paid=b.paid===''?total:fnum(b.paid);
  return {sub:sub,disc:disc,total:total,paid:paid,due:Math.round((total-paid)*100)/100};
}
function custByName(n){n=String(n||'').trim().toLowerCase();if(!n)return null;return DB.data.customers.find(function(c){return c.name.toLowerCase()===n})||null}
function billSubHTML(r){
  var p=r.pid?DB.get('products',r.pid):null;if(!p)return '';

  var h='<div>'+esc(unitFull(p))+'</div>';

  if(q>0&&p.unit==='bag'&&wk>0)h+='<div><bdi dir="ltr">'+esc(qtyFmt(wk)+' '+t('unit_kg'))+'</bdi></div>';
  var parts=DB.data.godowns.map(function(g){
    var left=Math.round((avail(r.pid,g.id)-(g.id===b.gid?need:0))*1000)/1000;
    return '<span'+(left<0?' class="neg"':'')+'>'+esc(g.name)+': <bdi dir="ltr">'+esc(qtyFmt(left))+'</bdi> '+esc(unitLabel(p.unit))+'</span>';

function blChange(el){
  var b=state.bill;if(!b)return;
  var k=el.dataset.bl;
  if(k==='gid'){b.gid=Number(el.value);render(true);return}
  var row=el.closest('.blrow'),r=row?b.rows[Number(row.dataset.i)]:null;
  if(k==='pid'&&r){
    r.pid=Number(el.value);var p=r.pid?DB.get('products',r.pid):null;
    r.price=p?p.sale_price:'';if(p&&r.qty==='')r.qty=1;
    document.getElementById('blLines').innerHTML=billLinesHTML();updateBillTotals();
  }
}
function saveBill(){
  var D=DB.data,b=state.bill,T=billTotals(),err='';
  var rows=b.rows.filter(function(r){return r.pid&&fnum(r.qty)>0});
  var no=String(b.no||'').trim();
  var need={};rows.forEach(function(r){need[r.pid]=(need[r.pid]||0)+fnum(r.qty)});
  if(!no)err=t('bl_err_no_empty');
  else if(D.sales.some(function(s){return invNo(s.invoice_no).toLowerCase()===invNo(no).toLowerCase()}))err=t('bl_err_no');
  else if(!rows.length)err=t('bl_err_items');
  else if(b.rows.some(function(r){return r.pid&&(fnum(r.qty)<0||fnum(r.price)<0)}))err=t('bl_err_price');
  if(!err){Object.keys(need).forEach(function(pid){
    if(err)return;var av=avail(Number(pid),b.gid);
    if(need[pid]>av+1e-9){var p=DB.get('products',Number(pid));err=t('bl_err_stock').replace('{name}',p?p.name:'?').replace('{n}',p?qtyText(p,av):qtyFmt(av))}
  })}
  if(!err&&(T.disc<0||T.disc>T.sub+1e-9))err=t('bl_err_disc');
  if(!err&&(T.paid<0||T.paid>T.total+1e-9))err=t('bl_err_paid');
  var nm=(b.name||'').trim(),cust=custByName(nm);
  if(!err&&T.due>0.004&&!cust&&!nm)err=t('bl_err_credit');
  var el=document.getElementById('bl_err');
  if(err){b.err=err;if(el)el.textContent=err;return}
  b.err='';
  var bph=(b.phone||'').trim(),bad=(b.addr||'').trim();
  if(!cust&&nm)cust=DB.insert('customers',{name:nm,phone:bph,address:bad});
  else if(cust&&((bph&&bph!==cust.phone)||(bad&&bad!==cust.address)))DB.update('customers',cust.id,{phone:bph||cust.phone,address:bad||cust.address});
  var now=new Date(),dt=b.date&&b.date!==todayInput()?new Date(b.date+'T12:00:00'):now;
  var sale=DB.insert('sales',{invoice_no:no,customer_id:cust?cust.id:null,customer_name:cust?'':nm,godown_id:b.gid,date:dt.toISOString(),subtotal:T.sub,discount:T.disc,total:T.total,paid:T.paid});
  rows.forEach(function(r){

function billHTML(sale){
  var st=DB.data.settings,keep=st.lang;st.lang='ps';
  try{return billHTMLps(sale)}finally{st.lang=keep}
}
function billHTMLps(sale){
  var D=DB.data,s=S(),items=D.sale_items.filter(function(i){return i.sale_id===sale.id});
  var cust=sale.customer_id?DB.get('customers',sale.customer_id):null,cname=cust?cust.name:(sale.customer_name||'');
  var fixed=D.products.filter(function(p){return p.active}).sort(function(a,b){return a.id-b.id}).slice(0,4);
  var used={},list=[];
  fixed.forEach(function(p){
    var k=-1;for(var j=0;j<items.length;j++){if(!used[j]&&items[j].product_id===p.id){k=j;break}}
    if(k>=0)used[k]=1;
    list.push({p:p,it:k>=0?items[k]:null});
  });
  items.forEach(function(it,j){if(!used[j])list.push({p:DB.get('products',it.product_id),it:it})});
  var n=Math.max(7,list.length),rows='',totKg=0;
  for(var i=0;i<n;i++){
    var L=list[i],num='<td class="c"><bdi dir="ltr">'+(i+1)+'</bdi></td>';
    if(!L){rows+='<tr>'+num+'<td></td><td></td><td></td><td></td></tr>';continue}
    var p=L.p,it=L.it;
    if(!it){rows+='<tr>'+num+'<td class="nm"><strong>'+esc(p?p.name:'—')+'</strong></td><td></td><td></td><td></td></tr>';continue}
    var wk=p?weightKg(p,it.qty):0,isBag=p&&p.unit==='bag'&&p.bag_kg>0;
    totKg+=wk;
    rows+='<tr>'+num+'<td class="nm"><strong>'+esc(p?p.name:'—')+'</strong>'+(isBag?'<div class="bsub">'+esc(unitFull(p))+'</div>':'')+'</td>'
     +'<td class="c"><bdi dir="ltr">'+qtyFmt(it.qty)+'</bdi>'+(isBag&&wk>0?'<div class="bsub"><bdi dir="ltr">'+qtyFmt(wk)+'</bdi> '+BL.kg+'</div>':'')+'</td>'
     +'<td class="c"><bdi dir="ltr">'+fmt(it.price)+'</bdi></td><td class="c"><bdi dir="ltr">'+fmt(Math.round(it.qty*it.price*100)/100)+'</bdi></td></tr>';
  }
  rows+='<tr class="tot"><td></td><td class="c"><strong>'+BL.total+'</strong></td><td colspan="3" class="c"><strong><bdi dir="ltr">'+fmt(sale.total)+' '+esc(s.currency)+'</bdi></strong></td></tr>';
  var due=Math.round((sale.total-sale.paid)*100)/100,extra='';
  if(sale.discount>0)extra+='<span>'+BL.disc+': <bdi dir="ltr">'+fmt(sale.discount)+'</bdi></span>';
  extra+='<span>'+BL.paid+': <bdi dir="ltr">'+fmt(sale.paid)+'</bdi></span><span>'+BL.rem+': <strong><bdi dir="ltr">'+fmt(due)+'</bdi></strong></span>';
  if(cust){var cd=Math.round(custStat(custMap(),cust.id).due*100)/100;if(cd>due+0.004)extra+='<span>'+BL.custrem+': <strong><bdi dir="ltr">'+fmt(cd)+'</bdi></strong></span>'}
  var wl='';
  if(totKg>0){
    var tn=Math.floor(totKg/1000+1e-9),rm=Math.round((totKg-tn*1000)*1000)/1000;
    wl='<div class="bill-wt">'+BL.wt+': <bdi dir="ltr">'+qtyFmt(totKg)+'</bdi> '+BL.kg+(tn>=1?' = <bdi dir="ltr">'+qtyFmt(tn)+'</bdi> '+BL.tn:'')+'</div>'
      +(tn>=1&&rm>0?'<div class="bsub bill-wt">'+BL.rem+': <bdi dir="ltr">'+qtyFmt(rm)+'</bdi> '+BL.kg+'</div>':'');
  }
  return '<div class="bill" id="billPaper" dir="rtl" lang="ps-AF"><div class="bill-name">'+esc(s.billShop||s.shopName)+'</div>'
   +'<div class="bill-mid"><div class="bill-txt">'+(s.shopTagline?'<div class="bill-tag">'+esc(s.shopTagline)+'</div>':'')
   +'<div class="bill-info">'+(s.shopAddress?'<span class="bill-pill">'+PIN+'<span>'+BL.addr+': '+esc(s.shopAddress)+'</span></span>':'')+(s.shopPhone?'<span class="bill-ph">'+PHN+'<span>'+BL.phone+': <bdi dir="ltr">'+esc(s.shopPhone)+'</bdi></span></span>':'')+'</div></div>'
   +'<img class="bill-logo" alt="" src="'+BILL_LOGO+'"></div>'
   +'<div class="bill-meta"><span class="f grow">'+BL.cust+': <b>'+esc(cname)+'</b>'+(cust&&(cust.phone||cust.address)?'<div class="bsub">'+(cust.phone?'<bdi dir="ltr">'+esc(cust.phone)+'</bdi>':'')+(cust.phone&&cust.address?' \u00B7 ':'')+esc(cust.address||'')+'</div>':'')+'</span><span class="f">'+BL.billno+': <b class="bill-no"><bdi dir="ltr">'+esc(invNo(sale.invoice_no))+'</bdi></b></span><span class="f">'+BL.date+': <b><bdi dir="ltr">'+shamsi(sale.date)+'</bdi></b></span></div>'
   +'<table><thead><tr><th class="c" style="width:12%">'+BL.no+'</th><th>'+BL.item+'</th><th class="c" style="width:15%">'+BL.qty+'</th><th class="c" style="width:15%">'+BL.price+'</th><th class="c" style="width:19%">'+BL.total+'</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +wl+'<div class="bill-extra">'+extra+'</div>'
   +'<div class="bill-foot"><span>'+BL.seller+': ..............</span><span class="grow">'+esc(s.billNote||'')+'</span><span>'+BL.buyer+': ..............</span></div></div>';
}
function saveBillImage(){
  var el=document.getElementById('billPaper');if(!el)return;
  var css='';Array.prototype.forEach.call(document.styleSheets,function(ss){try{Array.prototype.forEach.call(ss.cssRules,function(r){css+=r.cssText+'\n'})}catch(e){}});
  var w=el.offsetWidth,h=el.offsetHeight,sc=2,ff=getComputedStyle(el).fontFamily;
  var cl=el.cloneNode(true);cl.style.transform='';var xml=new XMLSerializer().serializeToString(cl);
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w*sc+'" height="'+h*sc+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="transform:scale('+sc+');transform-origin:0 0;width:'+w+'px;font-family:'+ff.replace(/"/g,"'")+'"><style>'+css+'</style>'+xml+'</div></foreignObject></svg>';
  var img=new Image();
  img.onload=function(){
    try{
      var c=document.createElement('canvas');c.width=w*sc;c.height=h*sc;
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0);
      c.toBlob(function(b){
        if(!b){window.print();return}
        var name='bill-'+(el.querySelector('.bill-no')?el.querySelector('.bill-no').textContent.trim():'')+'.png';
        try{var file=new File([b],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return}}catch(e){}
        var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
      },'image/png');
    }catch(e){window.print()}
  };
  img.onerror=function(){window.print()};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function fitBill(o){
  var fit=o.querySelector('#billFit'),el=o.querySelector('#billPaper');if(!fit||!el)return;
  el.style.transform='';fit.style.height='';
  var vw=document.documentElement.clientWidth||window.innerWidth,full=el.offsetWidth||600;
  var avail=Math.max(200,Math.min(full,vw-80)),sc=avail/full;
  fit.style.width=avail+'px';fit.style.margin='0 auto';
  if(sc<1){el.style.transformOrigin='top right';el.style.transform='scale('+sc+')'}
  fit.style.height=(Math.ceil(el.offsetHeight*sc)+6)+'px';
}
function openBillView(id,goHome){
  var sale=DB.get('sales',id);if(!sale)return;
  var o=openModal('<div class="bill-fit" id="billFit" dir="rtl">'+billHTML(sale)+'</div><div class="dlg-act no-print" style="margin-top:16px"><button class="btn" data-r="x">'+esc(t('close'))+'</button><button class="btn" data-r="img">'+esc(t('bl_save_img'))+'</button><button class="btn btn-primary" data-r="print">'+ic('receipt')+esc(t('bl_print'))+'</button></div>');
  o.firstChild.classList.add('xwide');
  fitBill(o);setTimeout(function(){fitBill(o)},150);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitBill(o)});
  window.addEventListener('resize',function rz(){if(!document.body.contains(o)){window.removeEventListener('resize',rz);return}fitBill(o)});
  o.addEventListener('click',function(e){
    var b=e.target.closest('[data-r]');
    if(e.target===o||(b&&b.dataset.r==='x')){o.close();if(goHome){state.view='dashboard';state.mobile=false;state.bell=false;render(false)}return}
    if(b&&b.dataset.r==='print')window.print();
    if(b&&b.dataset.r==='img')saveBillImage();
  });
}

function refundedOf(sid){var n=0;DB.data.refunds.forEach(function(r){if(r.sale_id===sid)n+=r.amount});return n}
function saleCustName(s){var c=s.customer_id?DB.get('customers',s.customer_id):null;return c?c.name:(s.customer_name||'')}
function salesFilter(){
  var q=state.slq.trim().toLowerCase(),cn={};
  DB.data.customers.forEach(function(c){cn[c.id]=c.name});
  return DB.data.sales.filter(function(s){
    if(state.sstat==='due'&&!(s.total-s.paid>0.004))return false;
    if(q&&!matchText(q,[s.invoice_no,s.customer_id?cn[s.customer_id]:s.customer_name]))return false;
    return true;
  }).sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:b.id-a.id)});
}
function salesRows(list){

  return list.slice(0,200).map(function(s){
    var due=Math.round((s.total-s.paid)*100)/100,rf=refundedOf(s.id),cn=saleCustName(s);

function round2(n){return Math.round(n*100)/100}
function supMap(){
  var m={};
  DB.data.supplier_tx.forEach(function(x){
    var r=m[x.supplier_id]||(m[x.supplier_id]={purch:0,paid:0,bal:0,n:0});
    r.n++;if(x.type==='purchase')r.purch+=x.amount;else r.paid+=x.amount;
  });
  Object.keys(m).forEach(function(k){m[k].bal=round2(m[k].purch-m[k].paid)});
  return m;
}
function supStat(m,id){return m[id]||{purch:0,paid:0,bal:0,n:0}}
function supFilter(m){
  var q=state.suq.trim().toLowerCase();
  return DB.data.suppliers.filter(function(s){
    var b=supStat(m,s.id).bal;
    if(state.sustat==='owe'&&!(b>0))return false;
    if(state.sustat==='theyowe'&&!(b<0))return false;
    return !q||matchText(q,[s.name,s.company,s.phone]);
  }).sort(sortByName);
}

  if(!list.length)return '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">'+esc(t('no_results'))+'</td></tr>';

    var r=supStat(m,s.id),b=r.bal;
    var tag=b>0?'<span class="tag warn">'+esc(t('su_s_owe'))+'</span>':(b<0?'<span class="tag ok">'+esc(t('su_s_theyowe'))+'</span>':'<span class="tag off">'+esc(t('su_s_clear'))+'</span>');

     +'<td class="n"><bdi dir="ltr">'+fmt(r.purch)+'</bdi></td><td class="n"><bdi dir="ltr">'+fmt(r.paid)+'</bdi></td>'
     +'<td class="n'+(b>0?' neg':'')+'"><strong><bdi dir="ltr">'+fmt(Math.abs(b))+'</bdi></strong></td><td>'+tag+'</td>'
     +'<td class="act"><button class="icon-btn" data-act="supurch" data-id="'+s.id+'" title="'+esc(t('su_purchase'))+'" aria-label="'+esc(t('su_purchase'))+'">'+ic('cart')+'</button>'

var PERS=['all','today','weekly','monthly','yearly'];
function perStart(p){
  var n=new Date();
  if(p==='today')return new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(p==='weekly')return new Date(Date.now()-7*864e5);
  if(p==='monthly')return new Date(Date.now()-30*864e5);
  if(p==='yearly')return new Date(Date.now()-365*864e5);
  return null;
}
function perOptions(sel){return PERS.map(function(p){return '<option value="'+p+'"'+(sel===p?' selected':'')+'>'+esc(t('per_'+p))+'</option>'}).join('')}
function textCard(label,text,tone,icon){
  return '<div class="card tone-'+tone+'"><div class="card-top"><span class="card-label">'+esc(label)+'</span><span class="chip">'+ic(icon)+'</span></div><div class="card-val" style="font-size:20px">'+text+'</div></div>';
}

function expFilter(){
  var from=perStart(state.exper),q=state.exq.trim().toLowerCase();
  return DB.data.expenses.filter(function(e){
    if(from&&new Date(e.date)<from)return false;
    if(state.excat!=='all'&&e.category!==state.excat)return false;
    return !q||matchText(q,[e.category,e.note]);
  }).sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:b.id-a.id)});
}

/* ---- loans ---- */
function loanLeft(l){return round2(l.amount-l.paid)}
function loanOver(l){return loanLeft(l)>0&&l.due_date&&new Date(l.due_date)<new Date(todayInput()+'T00:00:00')}
function loanFilter(){
  var q=state.loq.trim().toLowerCase(),f=state.lostat;
  return DB.data.loans.filter(function(l){
    if(f==='open'&&!(loanLeft(l)>0))return false;
    if(f==='overdue'&&!loanOver(l))return false;
    if(f==='given'&&l.direction!=='given')return false;
    if(f==='taken'&&l.direction!=='taken')return false;
    return !q||matchText(q,[l.party,l.note]);
  }).sort(function(a,b){var oa=loanLeft(a)>0?0:1,ob=loanLeft(b)>0?0:1;return oa-ob||(a.date<b.date?1:-1)});
}
function loanRows(list){
  if(!list.length)return '<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">'+esc(t('no_results'))+'</td></tr>';

     +'<td><span class="tag '+(given?'ok':'warn')+'">'+esc(t(given?'lo_given_s':'lo_taken_s'))+'</span></td>'

     +'<td class="n"><bdi dir="ltr">'+esc(l.due_date?fmtDate(l.due_date).slice(0,10):'—')+'</bdi>'+(over?' <span class="tag warn">'+esc(t('lo_overdue'))+'</span>':'')+(left<=0?' <span class="tag off">'+esc(t('lo_closed'))+'</span>':'')+'</td>'
     +'<td class="act">'+(left>0?'<button class="icon-btn" data-act="lorepay" data-id="'+l.id+'" title="'+esc(t(given?'lo_repay_in':'lo_repay_out'))+'" aria-label="'+esc(t(given?'lo_repay_in':'lo_repay_out'))+'">'+ic('coin')+'</button>':'')
     +'<button class="icon-btn" data-act="lohist" data-id="'+l.id+'" title="'+esc(t('lo_hist'))+'" aria-label="'+esc(t('lo_hist'))+'">'+ic('receipt')+'</button>'
     +'<button class="icon-btn" data-act="loedit" data-id="'+l.id+'" aria-label="'+esc(t('edit'))+'">'+ic('edit')+'</button>'
     +'<button class="icon-btn" data-act="lodel" data-id="'+l.id+'" aria-label="'+esc(t('delete'))+'">'+ic('trash')+'</button></td></tr>';
  }).join('');
}

function rRange(kind,val){
  var a,p;
  if(kind==='day'){p=String(val||todayInput()).split('-').map(Number);a=new Date(p[0],p[1]-1,p[2]);if(isNaN(a)){p=todayInput().split('-').map(Number);a=new Date(p[0],p[1]-1,p[2])}return [a,new Date(a.getFullYear(),a.getMonth(),a.getDate()+1)]}
  if(kind==='month'){p=String(val||todayInput().slice(0,7)).split('-').map(Number);a=new Date(p[0],p[1]-1,1);if(isNaN(a)){p=todayInput().split('-').map(Number);a=new Date(p[0],p[1]-1,1)}return [a,new Date(a.getFullYear(),a.getMonth()+1,1)]}
  return [perStart(val),null];
}
function inRg(iso,r){var d=new Date(iso);return (!r[0]||d>=r[0])&&(!r[1]||d<r[1])}
function saleCosts(){var m={};DB.data.sale_items.forEach(function(i){m[i.sale_id]=(m[i.sale_id]||0)+i.cost*i.qty});return m}
function figures(r,gid){
  var D=DB.data,cost=saleCosts(),sb={};D.sales.forEach(function(s){sb[s.id]=s});
  function gOK(g){return gid==='all'||g===gid}
  var sales=D.sales.filter(function(s){return inRg(s.date,r)&&gOK(s.godown_id)});
  var revenue=0,cogs=0;sales.forEach(function(s){revenue+=s.total;cogs+=cost[s.id]||0});
  var refunds=0;D.refunds.forEach(function(x){var s=sb[x.sale_id];if(s&&gOK(s.godown_id)&&inRg(x.date,r))refunds+=x.amount});
  var expenses=0;D.expenses.forEach(function(e){if(inRg(e.date,r))expenses+=e.amount});
  var staff=0;D.staff_tx.forEach(function(x){if(x.type==='payment'&&inRg(x.date,r))staff+=x.amount});
  var gross=revenue-cogs,net=gross-expenses-refunds;
  return {bills:sales.length,sales:sales,cost:cost,revenue:revenue,cogs:cogs,gross:gross,expenses:expenses,refunds:refunds,net:net,staff:staff,pure:net-staff,margin:revenue>0?gross/revenue*100:0};
}
function cashEvents(){
  var D=DB.data,ev=[],al={},sb={};
  D.sales.forEach(function(s){sb[s.id]=s});
  D.customer_payments.forEach(function(p){(p.alloc||[]).forEach(function(a){if(sb[a.sale_id]){al[a.sale_id]=(al[a.sale_id]||0)+a.amt;ev.push({k:'collect',d:p.date,v:a.amt})}})});
  D.sales.forEach(function(s){var v=round2(s.paid-(al[s.id]||0));if(v)ev.push({k:'sales',d:s.date,v:v})});
  D.refunds.forEach(function(x){ev.push({k:'refunds',d:x.date,v:-x.amount})});
  D.expenses.forEach(function(x){ev.push({k:'expenses',d:x.date,v:-x.amount})});
  D.supplier_tx.forEach(function(x){if(x.type==='payment')ev.push({k:'suppliers',d:x.date,v:-x.amount})});
  D.staff_tx.forEach(function(x){if(x.type==='payment')ev.push({k:'staff',d:x.date,v:-x.amount})});
  var lp={};D.loan_payments.forEach(function(p){lp[p.loan_id]=(lp[p.loan_id]||0)+p.amount});
  D.loans.forEach(function(l){
    var tk=l.direction==='taken';
    ev.push({k:tk?'loans_in':'loans_out',d:l.date,v:tk?l.amount:-l.amount});
    var res=round2((l.paid||0)-(lp[l.id]||0));
    if(res>0.004)ev.push({k:tk?'loan_repaid':'loan_back',d:l.date,v:tk?-res:res});
  });
  D.loan_payments.forEach(function(p){var l=DB.get('loans',p.loan_id);if(!l)return;var tk=l.direction==='taken';ev.push({k:tk?'loan_repaid':'loan_back',d:p.date,v:tk?-p.amount:p.amount})});
  return ev;
}
function cashSummary(r){
  var ev=cashEvents(),k={},inn=0,out=0,open=S().openingCash||0,all=open;
  ev.forEach(function(e){all+=e.v;if(inRg(e.d,r)){k[e.k]=(k[e.k]||0)+e.v;if(e.v>0)inn+=e.v;else out-=e.v}});
  return {k:k,inn:inn,out:out,net:inn-out,wallet:all,open:open,allTime:!r[0]&&!r[1]};
}
function frow(label,v,cls,signed){
  v=v||0;
  var c=signed?(v<0?'neg':(v>0?'pos':'')):'';
  return '<div class="frow '+(cls||'')+'"><span>'+esc(label)+'</span><strong class="'+c+'"><bdi dir="ltr">'+(signed&&v>0?'+':'')+fmt(v)+'</bdi> '+esc(S().currency)+'</strong></div>';
}

var CASH_ORDER=['sales','collect','loans_in','loan_back','refunds','expenses','suppliers','staff','loans_out','loan_repaid'];

  var head='<div class="page-head"><div><h1>'+esc(t('nav_financials'))+'</h1><p class="muted">'+esc(t('fin_sub'))+'</p></div>'
   +'<label class="pill big">'+ic('calendar')+'<select data-act="fper" aria-label="Period">'+perOptions(state.fper)+'</select></label></div>';

  var v1={f_wallet:c.wallet,f_cash_in:c.inn,f_cash_out:c.out,f_cash_net:c.net};
  var v2={revenue:f.revenue,f_gross:f.gross,net:f.net,pure:f.pure};
  var pr=frow(t('revenue'),f.revenue)+frow(t('f_cogs'),-f.cogs,'sub',1)+frow(t('f_gross'),f.gross,'ftot',1)

   +frow(t('staff_paid'),-f.staff,'sub',1)+frow(t('pure'),f.pure,'ftot',1)
   +'<div class="frow"><span>'+esc(t('f_margin'))+'</span><strong><bdi dir="ltr">'+f.margin.toFixed(1)+'%</bdi></strong></div>';
  var cr=c.allTime?frow(t('cl_opening'),c.open):'';
  CASH_ORDER.forEach(function(k){if(c.k[k])cr+=frow(t('cl_'+k),c.k[k],'',1)});
  cr+=frow(t('f_cash_net'),c.net,'ftot',1);
  if(c.allTime)cr+=frow(t('f_wallet'),c.wallet,'ftot');
  return head+banner
   +'<div class="grid g4" style="margin-top:18px">'+FC1.map(function(d){return card(d,v1[d.k])}).join('')+'</div>'

   +'<div class="panel" style="margin:0"><h3 class="ph">'+esc(t('fin_cash'))+'</h3>'+cr+'</div></div>'
   +'<p class="count-note">'+esc(t('fin_note'))+'</p>';

    return '<tr><td><strong><bdi dir="ltr">'+esc(invNo(s.invoice_no))+'</bdi></strong><div class="sub">'+esc(fmtDate(s.date).slice(11))+'</div></td><td>'+esc(saleCust(s))+'</td>'+numCell(s.total)+numCell(s.paid)+numCell(pf,pf<0?'neg':'')+'</tr>'}).join('');
