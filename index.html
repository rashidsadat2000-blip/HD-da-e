function repMonthly(){
  var D=DB.data,month=state.rmonth||todayInput().slice(0,7),r=rRange('month',month),f=figures(r,state.gid),c=cashSummary(r);
  var n=new Date(r[0].getFullYear(),r[0].getMonth()+1,0).getDate(),days=[],i;
  for(i=0;i<=n;i++)days.push({bills:0,rev:0,gross:0,exp:0,ref:0});
  var sb={};D.sales.forEach(function(s){sb[s.id]=s});
  f.sales.forEach(function(s){var d=days[new Date(s.date).getDate()];d.bills++;d.rev+=s.total;d.gross+=s.total-(f.cost[s.id]||0)});
  D.refunds.forEach(function(x){var s=sb[x.sale_id];if(s&&(state.gid==='all'||s.godown_id===state.gid)&&inRg(x.date,r))days[new Date(x.date).getDate()].ref+=x.amount});
  D.expenses.forEach(function(e){if(inRg(e.date,r))days[new Date(e.date).getDate()].exp+=e.amount});
  var mx=0;for(i=1;i<=n;i++)mx=Math.max(mx,days[i].rev);
  var bars='';
  for(i=1;i<=n;i++)bars+='<div class="mc" title="'+i+': '+fmt(days[i].rev)+'"><div class="mb"><i style="height:'+(mx>0?Math.max(2,days[i].rev/mx*100):0).toFixed(1)+'%"></i></div><b>'+i+'</b></div>';
  var pre=month+'-',rows='';
  for(i=1;i<=n;i++){var d=days[i];if(!d.bills&&!d.exp&&!d.ref)continue;var nt=d.gross-d.exp-d.ref;
    rows+='<tr><td class="n"><bdi dir="ltr">'+pre+String(i).padStart(2,'0')+'</bdi></td><td class="n"><bdi dir="ltr">'+d.bills+'</bdi></td>'+numCell(d.rev)+numCell(d.gross,d.gross<0?'neg':'')+numCell(d.exp)+numCell(d.ref)+numCell(nt,nt<0?'neg':'')+'</tr>'}
  var foot=rows?'<tr class="rtot"><td>'+esc(t('rp_totals'))+'</td><td class="n"><bdi dir="ltr">'+f.bills+'</bdi></td>'+numCell(f.revenue)+numCell(f.gross)+numCell(f.expenses)+numCell(f.refunds)+numCell(f.net,f.net<0?'neg':'')+'</tr>':'';
  return '<div class="toolbar no-print"><label class="pill big">'+ic('calendar')+'<input type="month" data-act="rmonth" value="'+esc(month)+'" aria-label="'+esc(t('rp_month'))+'"></label></div>'
   +repHd(month)+repCards(f,c)
   +'<div class="panel" style="margin-top:14px"><h3 class="ph">'+esc(t('rp_daily_chart'))+'</h3><div class="mchart" dir="ltr">'+bars+'</div></div>'
   +rpTable('',[t('rp_c_day'),t('rp_bills'),t('revenue'),t('f_gross'),t('expenses'),t('refunds'),t('rp_c_net')],rows,foot);
}
function repProducts(){
  var D=DB.data,r=rRange('p',state.rper),f=figures(r,state.gid),pm={},sb={};
  f.sales.forEach(function(s){sb[s.id]=s});
  D.sale_items.forEach(function(it){if(!sb[it.sale_id])return;var x=pm[it.product_id]||(pm[it.product_id]={q:0,v:0,pf:0});x.q+=it.qty;x.v+=it.qty*it.price;x.pf+=it.qty*(it.price-it.cost)});
  var list=Object.keys(pm).map(function(k){return {p:DB.get('products',Number(k)),x:pm[k]}}).filter(function(o){return o.p}).sort(function(a,b){return b.x.pf-a.x.pf}).slice(0,30);
  var prow=list.map(function(o){return '<tr><td><strong>'+esc(o.p.name)+'</strong></td><td class="n"><bdi dir="ltr">'+qtyFmt(o.x.q)+'</bdi> '+esc(unitLabel(o.p.unit))+'</td>'+numCell(o.x.v)+numCell(o.x.pf,o.x.pf<0?'neg':'')+'</tr>'}).join('');

  var crow=cl.map(function(o){var due=round2(o.x.b-o.x.p);return '<tr><td><strong>'+esc(o.c.name)+'</strong></td><td class="n"><bdi dir="ltr">'+o.x.n+'</bdi></td>'+numCell(o.x.b)+numCell(o.x.p)+numCell(due,due>0?'neg':'')+'</tr>'}).join('');

}

function downloadBackup(){
  DB.data.settings.lastBackup=new Date().toISOString();DB.save();
  var blob=new Blob([DB.exportText()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='retailpro-backup-'+todayInput()+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(url)},1500);
  render(true);toast(t('bk_done'));
}
function restoreFromFile(file){
  var fr=new FileReader();
  fr.onerror=function(){toast(t('bk_bad_file'))};
  fr.onload=function(){
    var txt=String(fr.result||''),ok=false;
    try{var d=JSON.parse(txt);ok=!!d&&typeof d==='object'&&d.version===1}catch(e){}
    if(!ok){toast(t('import_bad'));return}
    confirmBox(t('bk_confirm')).then(function(y){if(!y)return;if(DB.importText(txt)){state.exportText='';render(true);toast(t('import_ok'))}else toast(t('import_bad'))});
  };
  fr.readAsText(file);
}

/* ---- recycle bin ---- */
var RB_SHOW=['products','godowns','customers','staff','suppliers','categories','sales','expenses','loans','supplier_tx','loan_payments'];
function rbVisible(){
  var T=DB.data.trash,loanIds={};
  T.forEach(function(e){if(e.table_name==='loans')loanIds[e.row.id]=1});
  return T.filter(function(e){
    if(RB_SHOW.indexOf(e.table_name)<0)return false;
    if(e.table_name==='loan_payments'&&loanIds[e.row.loan_id])return false;
    return true;
  });
}
function rbName(e){
  var r=e.row,tb=e.table_name,cur=' '+S().currency;
  if(tb==='products')return [r.name,r.barcode||''];
  if(tb==='sales')return [invNo(r.invoice_no),saleCust(r)+' \u00B7 '+fmt(r.total)+cur];
  if(tb==='expenses')return [r.category,fmt(r.amount)+cur+(r.note?' \u00B7 '+r.note:'')];
  if(tb==='loans')return [r.party,fmt(r.amount)+cur];
  if(tb==='supplier_tx'){var s=DB.get('suppliers',r.supplier_id);return [(s?s.name:'\u2014'),t(r.type==='purchase'?'rb_tx_purchase':'rb_tx_payment')+' \u00B7 '+fmt(r.amount)+cur]}
  if(tb==='loan_payments'){var l=DB.get('loans',r.loan_id);return [fmt(r.amount)+cur,l?l.party:'']}
  if(tb==='customers')return [r.name,r.phone||''];
  if(tb==='staff')return [r.name,r.role||''];
  if(tb==='godowns')return [r.name,r.location||''];
  return [r.name||String(r.id),''];
}
function rbKids(e){
  var id=e.row.id,tb=e.table_name;
  return DB.data.trash.filter(function(k){
    var r=k.row;
    if(tb==='products')return k.table_name==='stock'&&r.product_id===id;
    if(tb==='godowns')return k.table_name==='stock'&&r.godown_id===id;
    if(tb==='sales')return (k.table_name==='sale_items'||k.table_name==='refunds')&&r.sale_id===id;
    if(tb==='loans')return k.table_name==='loan_payments'&&r.loan_id===id;
    return false;
  });
}
function restoreEntry(tid){
  var D=DB.data,e=D.trash.find(function(x){return x.id===tid});if(!e)return 'rb_err_parent';
  var tb=e.table_name,row=e.row,kids=rbKids(e),i;
  if(tb==='products'){
    if(row.sku&&D.products.some(function(p){return p.sku===row.sku}))return 'rb_err_sku';
    if(row.barcode&&D.products.some(function(p){return p.barcode===row.barcode}))return 'rb_err_bc';
  }
  if(tb==='godowns'&&D.godowns.some(function(g){return String(g.name).toLowerCase()===String(row.name).toLowerCase()}))return 'rb_err_dup';
  if(tb==='categories'&&D.categories.some(function(c){return String(c.name).toLowerCase()===String(row.name).toLowerCase()}))return 'rb_err_dup';
  if(tb==='supplier_tx'&&!DB.get('suppliers',row.supplier_id))return 'rb_err_parent';
  if(tb==='loan_payments'){var ln=DB.get('loans',row.loan_id);if(!ln)return 'rb_err_parent';if(row.amount>loanLeft(ln)+0.005)return 'rb_err_over'}
  var items=[];
  if(tb==='sales'){
    if(D.sales.some(function(s){return s.invoice_no===row.invoice_no}))return 'rb_err_inv';
    if(!DB.get('godowns',row.godown_id))return 'rb_err_god';
    items=kids.filter(function(k){return k.table_name==='sale_items'}).map(function(k){return k.row});
    var need={};items.forEach(function(it){need[it.product_id]=(need[it.product_id]||0)+it.qty});
    var keys=Object.keys(need);
    for(i=0;i<keys.length;i++){
      if(!DB.get('products',Number(keys[i])))return 'rb_err_parent';
      if(avail(Number(keys[i]),row.godown_id)+1e-9<need[keys[i]])return 'rb_err_stock';
    }
  }
  DB.restore(tid);
  kids.forEach(function(k){
    if(k.table_name==='stock'){
      var r=k.row,okp=DB.get('products',r.product_id)&&DB.get('godowns',r.godown_id);
      var dup=D.stock.some(function(x){return x.product_id===r.product_id&&x.godown_id===r.godown_id});
      if(okp&&!dup)DB.restore(k.id);else{D.trash=D.trash.filter(function(x){return x.id!==k.id})}
    }else if(k.table_name==='loan_payments'){DB.restore(k.id)}
    else DB.restore(k.id);
  });
  if(tb==='sales'){items.forEach(function(it){DB.adjustStock(it.product_id,row.godown_id,-it.qty,'out',row.invoice_no,row.id,'sale_restored')})}
  if(tb==='loan_payments'){var l2=DB.get('loans',row.loan_id);DB.update('loans',l2.id,{paid:round2(l2.paid+row.amount)})}
  DB.save();
  return null;
}
function rbPurge(tid){
  var D=DB.data,e=D.trash.find(function(x){return x.id===tid});if(!e)return;
  var ids={};ids[tid]=1;rbKids(e).forEach(function(k){ids[k.id]=1});
  D.trash=D.trash.filter(function(x){return !ids[x.id]});DB.save();
}
function rbFilter(){
  var q=state.rbq.trim().toLowerCase();
  return rbVisible().filter(function(e){
    if(state.rbtype!=='all'&&e.table_name!==state.rbtype)return false;
    var n=rbName(e);return !q||matchText(q,[n[0],n[1]]);
  }).sort(function(a,b){return a.deleted_at<b.deleted_at?1:(a.deleted_at>b.deleted_at?-1:b.id-a.id)});
}
function rbRows(list){
  if(!list.length)return '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">'+esc(t('no_results'))+'</td></tr>';
  return list.slice(0,200).map(function(e){
    var n=rbName(e);
    return '<tr><td><strong>'+esc(n[0])+'</strong><div class="sub">'+esc(n[1])+'</div></td><td><span class="tag off">'+esc(t('rb_t_'+e.table_name))+'</span></td>'
     +'<td class="n"><bdi dir="ltr">'+esc(fmtDate(e.deleted_at))+'</bdi></td>'
     +'<td class="act"><button class="btn chip-btn" data-act="rbrestore" data-id="'+e.id+'">'+ic('undo')+esc(t('rb_restore'))+'</button> '
     +'<button class="icon-btn" data-act="rbpurge" data-id="'+e.id+'" aria-label="'+esc(t('rb_purge'))+'" title="'+esc(t('rb_purge'))+'">'+ic('trash')+'</button></td></tr>';

}
